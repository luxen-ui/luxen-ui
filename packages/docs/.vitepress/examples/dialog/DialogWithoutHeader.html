<button
  type="button"
  class="l-button"
  command="--show"
  commandfor="dialog-without-header"
>
  Delete account
</button>

<l-dialog
  id="dialog-without-header"
  without-header
>
  <div class="grid justify-items-center gap-3 pb-2 text-center">
    <span
      class="flex size-12 items-center justify-center rounded-full bg-red-100 text-2xl text-red-700 dark:bg-red-950 dark:text-red-300"
    >
      <l-icon name="lucide:triangle-alert"></l-icon>
    </span>
    <h2 class="text-lg font-semibold">Delete your account?</h2>
    <p class="text-sm">
      This action is permanent and cannot be undone. All your data, including projects and billing
      history, will be erased.
    </p>
  </div>
  <menu slot="footer">
    <button
      autofocus
      type="button"
      class="l-button"
      command="--hide"
      commandfor="dialog-without-header"
    >
      Cancel
    </button>
    <button
      type="button"
      class="l-button"
      data-variant="destructive"
      command="--hide"
      commandfor="dialog-without-header"
    >
      Delete account
    </button>
  </menu>
</l-dialog>
