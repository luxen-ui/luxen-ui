<button
  type="button"
  class="l-button"
  command="--show"
  commandfor="my-dialog"
>
  Open dialog
</button>

<l-dialog
  id="my-dialog"
  title="Dialog title"
>
  <button
    slot="close"
    type="button"
    class="l-close"
    data-appearance="ring"
    aria-label="Close"
    command="--hide"
    commandfor="my-dialog"
  ></button>
  <article class="h-[340px]">…</article>
  <menu slot="footer">
    <button
      autofocus
      type="button"
      class="l-button"
      command="--hide"
      commandfor="my-dialog"
    >
      Cancel
    </button>
    <button
      type="button"
      class="l-button"
      data-variant="primary"
    >
      Confirm
    </button>
  </menu>
</l-dialog>
