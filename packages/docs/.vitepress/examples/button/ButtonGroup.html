<l-button-group label="Text formatting">
  <button
    class="l-button"
    data-icon-only
    aria-label="Bold"
  >
    <l-icon name="lucide:bold"></l-icon>
  </button>
  <button
    class="l-button"
    data-icon-only
    aria-label="Italic"
  >
    <l-icon name="lucide:italic"></l-icon>
  </button>
  <button
    class="l-button"
    data-icon-only
    aria-label="Underline"
  >
    <l-icon name="lucide:underline"></l-icon>
  </button>
</l-button-group>
