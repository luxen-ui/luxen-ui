<div class="grid gap-4 max-w-sm">
  <l-form-field>
    <label>Text</label>
    <input
      type="text"
      placeholder="Placeholder text"
    />
  </l-form-field>
  <l-form-field>
    <label>Number</label>
    <input
      type="number"
      placeholder="Placeholder text"
    />
  </l-form-field>
  <l-form-field>
    <label>Password</label>
    <input
      type="password"
      value="supersecret"
    />
  </l-form-field>
  <l-form-field>
    <label>Date</label>
    <input type="date" />
  </l-form-field>
  <l-form-field>
    <label>Time</label>
    <input type="time" />
  </l-form-field>
  <l-form-field>
    <label>Search</label>
    <input
      type="search"
      value="This a value"
    />
  </l-form-field>
</div>
