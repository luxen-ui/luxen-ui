<div class="grid gap-4 max-w-sm">
  <l-form-field>
    <label>Search</label>
    <l-input-group>
      <l-icon name="lucide:search"></l-icon>
      <input
        type="search"
        placeholder="Search"
      />
    </l-input-group>
  </l-form-field>
  <l-form-field>
    <label>Height</label>
    <l-input-group>
      <input
        type="number"
        placeholder="Placeholder text"
      />
      <span>cm</span>
    </l-input-group>
  </l-form-field>
  <l-form-field>
    <label>Email</label>
    <l-input-group>
      <l-icon name="lucide:mail"></l-icon>
      <input
        type="email"
        placeholder="jane@acme.com"
      />
    </l-input-group>
  </l-form-field>
</div>
