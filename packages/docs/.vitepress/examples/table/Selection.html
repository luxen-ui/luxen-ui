<table class="l-table">
  <caption>
    Products
  </caption>
  <thead>
    <tr>
      <th
        scope="col"
        data-select
      >
        <span class="l-visually-hidden">Selection</span>
      </th>
      <th scope="col">SKU</th>
      <th scope="col">Name</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td data-select>
        <input
          type="checkbox"
          class="l-checkbox"
          name="product"
          value="sku-1042"
          aria-label="Select SKU-1042"
          checked
        />
      </td>
      <th scope="row">SKU-1042</th>
      <td>Desk lamp</td>
    </tr>
    <tr>
      <td data-select>
        <input
          type="checkbox"
          class="l-checkbox"
          name="product"
          value="sku-2087"
          aria-label="Select SKU-2087"
        />
      </td>
      <th scope="row">SKU-2087</th>
      <td>Office chair</td>
    </tr>
    <tr>
      <td data-select>
        <input
          type="checkbox"
          class="l-checkbox"
          name="product"
          value="sku-3110"
          aria-label="Select SKU-3110"
        />
      </td>
      <th scope="row">SKU-3110</th>
      <td>Standing desk</td>
    </tr>
  </tbody>
</table>
