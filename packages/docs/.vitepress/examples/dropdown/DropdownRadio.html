<l-dropdown>
  <button
    slot="trigger"
    class="l-button"
  >
    Sort
  </button>
  <l-dropdown-label>Sort by</l-dropdown-label>
  <l-dropdown-item
    type="radio"
    value="name"
    checked
    >Name</l-dropdown-item
  >
  <l-dropdown-item
    type="radio"
    value="modified"
    >Date modified</l-dropdown-item
  >
  <l-dropdown-item
    type="radio"
    value="size"
    >Size</l-dropdown-item
  >

  <l-divider></l-divider>

  <l-dropdown-label>Order</l-dropdown-label>
  <l-dropdown-item
    type="radio"
    value="asc"
    checked
    >Ascending</l-dropdown-item
  >
  <l-dropdown-item
    type="radio"
    value="desc"
    >Descending</l-dropdown-item
  >
</l-dropdown>
