<l-dropdown>
  <button
    slot="trigger"
    class="l-button"
  >
    Edit
  </button>

  <l-dropdown-item
    value="cut"
    shortcut="Ctrl+X"
    >Cut</l-dropdown-item
  >
  <l-dropdown-item
    value="copy"
    shortcut="Ctrl+C"
    >Copy</l-dropdown-item
  >
  <l-dropdown-item
    value="paste"
    shortcut="Ctrl+V"
    >Paste</l-dropdown-item
  >

  <l-divider></l-divider>

  <l-dropdown-item
    value="duplicate"
    shortcut="Ctrl+D"
    >Duplicate</l-dropdown-item
  >
  <l-dropdown-item
    value="palette"
    shortcut="Ctrl+Shift+P"
    >Command palette</l-dropdown-item
  >
</l-dropdown>
