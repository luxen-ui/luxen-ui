<select
  class="l-select"
  aria-label="Team"
>
  <button>
    <selectedcontent></selectedcontent>
  </button>

  <option
    value="design"
    selected
  >
    <span class="l-select-item-text">
      <span class="l-select-item-title">Design</span>
      <span class="l-select-item-description">Product and brand design</span>
    </span>
    <span class="l-select-item-suffix">
      <l-badge
        size="sm"
        appearance="filled"
        >12 members</l-badge
      >
    </span>
  </option>

  <option value="engineering">
    <span class="l-select-item-text">
      <span class="l-select-item-title">Engineering</span>
      <span class="l-select-item-description">Platform, web and mobile apps</span>
    </span>
    <span class="l-select-item-suffix">
      <l-badge
        size="sm"
        appearance="filled"
        >48 members</l-badge
      >
    </span>
  </option>

  <option value="support">
    <span class="l-select-item-text">
      <span class="l-select-item-title">Support</span>
      <span class="l-select-item-description">Customer success and onboarding</span>
    </span>
    <span class="l-select-item-suffix">
      <l-badge
        size="sm"
        appearance="filled"
        variant="warning"
        >Full</l-badge
      >
    </span>
  </option>
</select>
