<div class="flex flex-wrap items-center gap-4">
  <button
    id="popover-top"
    class="l-button"
  >
    Top
  </button>
  <l-popover
    for="popover-top"
    placement="top"
  >
    <span class="block px-4 py-3">Placed on top</span>
  </l-popover>

  <button
    id="popover-bottom"
    class="l-button"
  >
    Bottom
  </button>
  <l-popover
    for="popover-bottom"
    placement="bottom"
  >
    <span class="block px-4 py-3">Placed on bottom</span>
  </l-popover>

  <button
    id="popover-left"
    class="l-button"
  >
    Left
  </button>
  <l-popover
    for="popover-left"
    placement="left"
  >
    <span class="block px-4 py-3">Placed on left</span>
  </l-popover>

  <button
    id="popover-right"
    class="l-button"
  >
    Right
  </button>
  <l-popover
    for="popover-right"
    placement="right"
  >
    <span class="block px-4 py-3">Placed on right</span>
  </l-popover>
</div>
