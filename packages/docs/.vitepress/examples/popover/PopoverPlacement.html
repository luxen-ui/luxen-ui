    class="l-button"
  >
    Top
  </button>
  <l-popover
    for="popover-top"
    placement="top"
    >Placed on top</l-popover
  >

  <button
    id="popover-bottom"
    class="l-button"
  >
    Bottom
  </button>
  <l-popover
    for="popover-bottom"
    placement="bottom"

  <button

  >
    Left
  </button>
  <l-popover
    for="popover-left"
    placement="left"

  <button

  </button>
  <l-popover
