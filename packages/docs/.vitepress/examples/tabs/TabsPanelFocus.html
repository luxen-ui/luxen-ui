<l-tabs variant="line">
  <div>
    <button
      name="report"
      aria-selected="true"
    >
      Report
    </button>
    <button name="summary">Summary</button>
  </div>
  <div class="p-4 text-sm text-secondary">
    <a
      href="#"
      class="font-semibold text-primary underline-offset-4 hover:underline"
      >Download the report</a
    >
    <p class="mt-2">
      This panel opens with a link, so pressing Tab from the tablist moves focus straight to it.
    </p>
  </div>
  <div class="p-4 text-sm text-secondary">
    <p>
      This panel opens with text, so it takes a tab stop of its own — Tab lands on the panel, then
      on the link.
    </p>
    <a
      href="#"
      class="mt-2 inline-block font-semibold text-primary underline-offset-4 hover:underline"
      >Download the summary</a
    >
  </div>
</l-tabs>
