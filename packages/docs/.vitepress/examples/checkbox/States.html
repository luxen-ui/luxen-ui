<div class="flex flex-col gap-3">
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
    />
    Unchecked
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      checked
    />
    Checked
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      id="demo-indeterminate"
    />
    Indeterminate
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      disabled
    />
    Disabled
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      checked
      disabled
    />
    Disabled checked
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      aria-invalid="true"
    />
    Invalid
  </label>
  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="l-checkbox"
      checked
      aria-invalid="true"
    />
    Invalid checked
  </label>
</div>
