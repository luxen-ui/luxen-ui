<fieldset
  class="l-radio-group"
  data-orientation="vertical"
>
  <legend>Notifications</legend>
  <label>
    <input
      type="radio"
      class="l-radio"
      name="notifications"
      value="all"
      checked
    />
    All new messages
  </label>
  <label>
    <input
      type="radio"
      class="l-radio"
      name="notifications"
      value="mentions"
    />
    Direct messages and mentions
  </label>
  <label>
    <input
      type="radio"
      class="l-radio"
      name="notifications"
      value="none"
    />
    Nothing
  </label>
</fieldset>
