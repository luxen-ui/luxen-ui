<fieldset
  class="l-radio-group"
  data-appearance="button"
>
  <legend>Plan</legend>
  <label class="l-button">
    <input
      type="radio"
      name="plan"
      value="free"
      checked
    />
    Free
  </label>
  <label class="l-button">
    <input
      type="radio"
      name="plan"
      value="pro"
    />
    Pro
  </label>
  <label class="l-button">
    <input
      type="radio"
      name="plan"
      value="enterprise"
      disabled
    />
    Enterprise
  </label>
</fieldset>
