<fieldset
  class="l-radio-group"
  data-appearance="button"
>
  <legend>Small</legend>
  <label
    class="l-button"
    data-size="sm"
  >
    <input
      type="radio"
      name="density-sm"
      value="compact"
      checked
    />
    Compact
  </label>
  <label
    class="l-button"
    data-size="sm"
  >
    <input
      type="radio"
      name="density-sm"
      value="cosy"
    />
    Cosy
  </label>
</fieldset>
