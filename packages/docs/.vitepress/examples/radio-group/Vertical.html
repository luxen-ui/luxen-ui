<fieldset
  class="l-radio-group"
  data-appearance="button"
  data-orientation="vertical"
>
  <legend>Delivery</legend>
  <label class="l-button">
    <input
      type="radio"
      name="delivery"
      value="standard"
      checked
    />
    Standard
  </label>
  <label class="l-button">
    <input
      type="radio"
      name="delivery"
      value="express"
    />
    Express
  </label>
  <label class="l-button">
    <input
      type="radio"
      name="delivery"
      value="pickup"
    />
    Pickup
  </label>
</fieldset>
