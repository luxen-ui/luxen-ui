<div class="grid gap-4 max-w-sm">
  <l-form-field>
    <label>Vertical (default)</label>
    <textarea
      rows="3"
      placeholder="Drag the bottom edge to resize…"
    ></textarea>
  </l-form-field>
  <l-form-field>
    <label>None</label>
    <textarea
      data-resize="none"
      rows="3"
      placeholder="Fixed height"
    ></textarea>
  </l-form-field>
  <l-form-field>
    <label>Auto</label>
    <textarea
      data-resize="auto"
      rows="2"
      placeholder="Grows as you type…"
    ></textarea>
  </l-form-field>
</div>
