<fieldset class="flex flex-col gap-3 border-0 p-0 m-0">
  <legend class="mb-2 font-medium">Plan</legend>
  <l-form-field>
    <label>Free</label>
    <input
      type="radio"
      name="plan"
      value="free"
      checked
    />
    <p class="l-hint">For individuals getting started.</p>
  </l-form-field>
  <l-form-field>
    <label>Pro</label>
    <input
      type="radio"
      name="plan"
      value="pro"
    />
    <p class="l-hint">For growing teams that need more.</p>
  </l-form-field>
</fieldset>
