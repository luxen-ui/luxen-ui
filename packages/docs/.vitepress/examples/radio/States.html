<div class="flex flex-col gap-3">
  <l-form-field>
    <label>Unselected</label>
    <input
      type="radio"
      name="states"
    />
  </l-form-field>
  <l-form-field>
    <label>Selected</label>
    <input
      type="radio"
      name="states"
      checked
    />
  </l-form-field>
  <l-form-field>
    <label>Disabled</label>
    <input
      type="radio"
      name="states-disabled"
      disabled
    />
  </l-form-field>
  <l-form-field>
    <label>Disabled selected</label>
    <input
      type="radio"
      name="states-disabled-selected"
      checked
      disabled
    />
  </l-form-field>
  <l-form-field invalid>
    <label>Invalid (required, none selected)</label>
    <input
      type="radio"
      name="states-invalid"
      required
    />
  </l-form-field>
</div>
