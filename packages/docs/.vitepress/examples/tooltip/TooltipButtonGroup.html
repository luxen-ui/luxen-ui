<l-button-group label="Text formatting">
  <button
    id="tooltip-tb-bold"
    class="l-button"
    aria-label="Bold"
  >
    <iconify-icon icon="lucide:bold"></iconify-icon>
  </button>
  <button
    id="tooltip-tb-italic"
    class="l-button"
    aria-label="Italic"
  >
    <iconify-icon icon="lucide:italic"></iconify-icon>
  </button>
  <button
    id="tooltip-tb-underline"
    class="l-button"
    aria-label="Underline"
  >
    <iconify-icon icon="lucide:underline"></iconify-icon>
  </button>
  <button
    id="tooltip-tb-link"
    class="l-button"
    aria-label="Insert link"
  >
    <iconify-icon icon="lucide:link"></iconify-icon>
  </button>
</l-button-group>

<l-tooltip
  for="tooltip-tb-bold"
  show-delay="400"
  >Bold</l-tooltip
>
<l-tooltip
  for="tooltip-tb-italic"
  show-delay="400"
  >Italic</l-tooltip
>
<l-tooltip
  for="tooltip-tb-underline"
  show-delay="400"
  >Underline</l-tooltip
>
<l-tooltip
  for="tooltip-tb-link"
  show-delay="400"
  >Insert link</l-tooltip
>
