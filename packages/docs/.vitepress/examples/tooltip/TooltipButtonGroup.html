<l-button-group label="Text formatting">
  <button
    id="tooltip-tb-bold"
    class="l-button"
    data-icon-only
    aria-label="Bold"
  >
    <l-icon name="lucide:bold"></l-icon>
  </button>
  <button
    id="tooltip-tb-italic"
    class="l-button"
    data-icon-only
    aria-label="Italic"
  >
    <l-icon name="lucide:italic"></l-icon>
  </button>
  <button
    id="tooltip-tb-underline"
    class="l-button"
    data-icon-only
    aria-label="Underline"
  >
    <l-icon name="lucide:underline"></l-icon>
  </button>
  <button
    id="tooltip-tb-link"
    class="l-button"
    data-icon-only
    aria-label="Insert link"
  >
    <l-icon name="lucide:link"></l-icon>
  </button>
</l-button-group>

<l-tooltip
  for="tooltip-tb-bold"
  show-delay="400"
  >Bold</l-tooltip
>
<l-tooltip
  for="tooltip-tb-italic"
  show-delay="400"
  >Italic</l-tooltip
>
<l-tooltip
  for="tooltip-tb-underline"
  show-delay="400"
  >Underline</l-tooltip
>
<l-tooltip
  for="tooltip-tb-link"
  show-delay="400"
  >Insert link</l-tooltip
>
