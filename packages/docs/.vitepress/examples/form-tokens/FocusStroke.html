<div
  class="grid max-w-sm gap-4 [--l-form-control-focus-border-width:2px] [--l-form-control-focus-halo-width:0px]"
>
  <l-form-field>
    <label>Start date</label>
    <input type="date" />
  </l-form-field>
  <l-form-field>
    <label>Plan</label>
    <select class="l-select">
      <option>Starter</option>
      <option>Pro</option>
    </select>
  </l-form-field>
  <l-select
    label="Team"
    placeholder="Pick a team…"
  >
    <datalist>
      <option value="design">Design</option>
      <option value="dev">Development</option>
    </datalist>
  </l-select>
  <l-combobox
    label="Country"
    placeholder="Search a country…"
  >
    <datalist>
      <option value="fr">France</option>
      <option value="de">Germany</option>
    </datalist>
  </l-combobox>
</div>
