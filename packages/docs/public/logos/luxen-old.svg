<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 66" width="66" height="66">
  <defs>
    <!-- HTML5 two-tone gradient: #EF652A light → #E34F26 dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#EF652A"/>
      <stop offset="100%" stop-color="#E34F26"/>
    </linearGradient>

    <!-- Glass shine on top half -->
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle glow behind the symbol -->
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background — less rounded, HTML5 palette -->
  <rect width="66" height="66" rx="7" fill="url(#bg)"/>

  <!-- Glass reflection -->
  <rect width="66" height="36" rx="7" fill="url(#shine)"/>

  <!-- Connected ligature </> — one continuous stroke -->
  <path
    d="M25,17 L11,33 L27,49 L39,17 L55,33 L41,49"
    stroke="white"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
</svg>