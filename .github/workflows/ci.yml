name: ✨ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🧹 Lint & format check
  check:
    name: 🧹 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install

      # Resolve the installed Playwright version to key the browser cache on.
      # Run from packages/ui — pnpm does not hoist `playwright` to the repo root.
      - name: Read the resolved playwright version
        id: pwv
        working-directory: packages/ui
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Cache the downloaded browser binaries (keyed on the Playwright version,
      # NOT the lockfile hash — the binary only changes when Playwright bumps).
      # On a warm cache the install step below skips the download and only runs
      # the cheap apt `--with-deps` portion.
      - name: Cache the playwright browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pwv.outputs.version }}

      - run: vp run --filter 'luxen-ui...' build
      - run: vp check
      # Install the browser before any browser-backed run: luxen-ui#test now
      # includes Vitest browser-mode component tests, and test:e2e uses Playwright.
      - run: vp dlx playwright install chromium --with-deps
      - run: vp run luxen-ui#test
      - run: vp run luxen-ui#test:e2e

  # 🏗️ Full build: CSS → TypeScript → CDN → Manifest
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp run -r --cache build

  # 📝 Validate commit messages follow conventional commits
  commitlint:
    name: 📝 Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp dlx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # 🦋 Ensure each PR ships a changeset (or an explicit empty one)
  changeset:
    name: 🦋 Changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - name: Require a changeset for release PR types only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          type="${PR_TITLE%%[(:]*}"
          case "$type" in
            feat|fix)
              echo "release type '$type' — checking for a changeset"
              vp dlx @changesets/cli status --since=origin/main
              ;;
            *)
              echo "non-release PR type '$type' — changeset not required"
              ;;
          esac
