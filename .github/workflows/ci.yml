name: ✨ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🧹 Lint & format check
  check:
    name: 🧹 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp run --filter 'luxen-ui...' build
      - run: vp check
      # Install the browser before any browser-backed run: luxen-ui#test now
      # includes Vitest browser-mode component tests, and test:e2e uses Playwright.
      - run: vp dlx playwright install chromium --with-deps
      - run: vp run luxen-ui#test
      - run: vp run luxen-ui#test:e2e

  # 🏗️ Full build: CSS → TypeScript → CDN → Manifest
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp run -r --cache build

  # 📝 Validate commit messages follow conventional commits
  commitlint:
    name: 📝 Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp dlx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # 🦋 Ensure each PR ships a changeset (or an explicit empty one)
  changeset:
    name: 🦋 Changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install
      - run: vp dlx @changesets/cli status --since=origin/main
