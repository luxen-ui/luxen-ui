name: 🚀 Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install

      # `publish` invokes `vp run release` which runs `pnpm publish -r`,
      # ensuring `catalog:` and `workspace:` protocols are resolved in the tarball.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: vp run version
          publish: vp run release
          title: 'chore: release'
          commit: 'chore: release'
          # Disabled during 0.x phase (lib under construction).
          # Re-enable when going to 1.0 to officialize releases on the GitHub Releases page.
          # Git tags are still created automatically by `pnpm publish` regardless of this flag.
          # createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
