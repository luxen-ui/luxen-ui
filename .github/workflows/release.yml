name: 🚀 Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - run: vp install

      # `publish` invokes `vp run release` which runs `pnpm publish -r`,
      # ensuring `catalog:` and `workspace:` protocols are resolved in the tarball.
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: vp run version
          publish: vp run release
          title: 'chore: release'
          commit: 'chore: release'
          # GitHub Releases stay disabled during the 0.x phase (lib under construction).
          # Re-enable when going to 1.0 to officialize releases on the GitHub Releases page.
          # Note: neither this flag nor `pnpm publish` creates git tags — the
          # "Tag release and deploy docs" step below does that explicitly.
          # createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # On a real publish, tag the release commit `v<version>` (luxen-ui's version)
      # and deploy the docs. The tag marks the released version; the Netlify build
      # hook is curled in the SAME run on purpose — a separate `on: push: tags`
      # workflow would never fire for a tag pushed with GITHUB_TOKEN. luxen-ui.com
      # thus always reflects the last released package, not bare main. The deploy is
      # a no-op until NETLIFY_BUILD_HOOK_URL is configured; tagging still happens.
      - name: Tag release and deploy docs to production
        if: steps.changesets.outputs.published == 'true'
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed git tag $TAG."
          fi
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            curl -fsSL -X POST -d '{"trigger_title":"release '"$TAG"'"}' "$NETLIFY_BUILD_HOOK_URL"
            echo "Triggered Netlify production deploy for $TAG."
          else
            echo "NETLIFY_BUILD_HOOK_URL not set — skipping docs deploy."
          fi
