packages:
  - packages/*
  - demos/*

catalog:
  '@commitlint/cli': '^21.2.4'
  '@commitlint/config-conventional': '^21.2.4'
  '@custom-elements-manifest/analyzer': '^0.11.0'
  '@custom-elements-manifest/to-markdown': '^0.1.0'
  '@floating-ui/dom': '^1.8.0'
  '@tailwindcss/vite': '^4.3.4'
  '@tiptap/core': '^3.32.3'
  '@tiptap/extension-highlight': '^3.32.3'
  '@tiptap/extensions': '^3.32.3'
  '@tiptap/pm': '^3.32.3'
  '@tiptap/starter-kit': '^3.32.3'
  '@types/node': '^26.6.6'
  autoprefixer: '^10.6.2'
  browserslist: '^4.29.5'
  css-extras: '^0.4.0'
  csskit: '^0.0.36'
  embla-carousel: '^8.6.0'
  embla-carousel-autoplay: '^8.6.0'
  emoji-picker-element: '^1.29.1'
  iconify-icon: '^3.0.5'
  lit: '^3.3.3'
  postcss: '^8.5.32'
  postcss-import: '^17.0.1'
  tailwindcss: '^4.3.4'
  tinyglobby: '^0.2.17'
  typescript: '^6.0.3'
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plugin-dts: '^5.1.2'
  vite-plus: 1.5.0
  vitepress: '2.0.0-alpha.21'
  vitest: 5.1.0
  '@vitest/browser-playwright': 5.1.0
allowBuilds:
  esbuild: true
  rs-module-lexer: true
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
